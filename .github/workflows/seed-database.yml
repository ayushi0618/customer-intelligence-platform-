name: Seed remote database

# One-time (re-runnable) job: creates the schema and loads the synthetic
# dataset + demo users + initial analytics into the hosted MySQL database.
# It also commits the DB_SSL TLS-support change to main so the deployed
# backend (Vercel) and ML service (Render) can talk to managed MySQL
# providers such as Aiven, which require TLS.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply managed-MySQL TLS support patch
        env:
          SSL_PATCH_B64: 
        run: |
          echo "$SSL_PATCH_B64" | base64 -d > /tmp/ssl.patch
          if git apply --check /tmp/ssl.patch 2>/dev/null; then
            git apply /tmp/ssl.patch
            echo "TLS support patch applied."
          else
            echo "Patch already applied; skipping."
          fi

      - name: Commit TLS support to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/config/database.js database/scripts/migrate.js database/scripts/seed.js database/scripts/validate_data.js ml-service/app/config.py ml-service/app/database.py
          git commit -m "Add DB_SSL option for managed MySQL (Aiven) TLS connections" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run database migration
        run: node database/scripts/migrate.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'true'

      - name: Seed synthetic dataset
        run: node database/scripts/seed.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'true'

      - name: Validate seeded data
        run: node database/scripts/validate_data.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'true'

      - name: Initialize analytics (RFM, attribution, recommendations)
        run: node database/scripts/init_analytics.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: 'true'
