version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: analytics_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ayushi}
      MYSQL_DATABASE: ${DB_NAME:-customer_intelligence}
      MYSQL_USER: ${DB_USER:-analytics_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ayushi}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ayushi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-customer_intelligence}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-ayushi}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_customer_intelligence_2026_secure}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: analytics_ml_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-customer_intelligence}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-ayushi}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytics_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
